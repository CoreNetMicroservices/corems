name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force-publish:
        description: 'Force publish all shared NuGet packages'
        type: boolean
        default: false

permissions:
  packages: write
  contents: read

jobs:
  build-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore backend/CoreMs.slnx

      - name: Build
        run: dotnet build backend/CoreMs.slnx --no-restore

      - name: Test
        run: dotnet test backend/CoreMs.slnx --no-build --verbosity normal

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate bootstrap layer
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate foundation layer
        working-directory: infra/foundation
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate services layer
        working-directory: infra/services
        run: |
          terraform init -backend=false
          terraform validate

  publish-packages:
    name: Publish NuGet Packages
    runs-on: ubuntu-latest
    needs: build-backend
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.force-publish)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Detect changed packages
        id: changes
        run: |
          # Find all packable projects (single line, space-separated)
          PACKABLE=$(grep -rl "<IsPackable>true</IsPackable>" backend/ --include="*.csproj" | sort | tr '\n' ' ' | xargs)
          echo "Packable projects: $PACKABLE"

          if [ "${{ inputs.force-publish }}" == "true" ]; then
            echo "Force publish: all packable projects"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "projects=$PACKABLE" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          PROJECTS=""

          for csproj in $PACKABLE; do
            PROJECT_DIR=$(dirname "$csproj")/
            if echo "$CHANGED_FILES" | grep -q "^$PROJECT_DIR"; then
              PROJECTS="$PROJECTS $csproj"
            fi
          done

          PROJECTS=$(echo "$PROJECTS" | xargs)
          if [ -z "$PROJECTS" ]; then
            echo "No shared library changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changed projects: $PROJECTS"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "projects=$PROJECTS" >> $GITHUB_OUTPUT
          fi

      - name: Pack changed packages
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          for project in ${{ steps.changes.outputs.projects }}; do
            echo "Packing $project..."
            dotnet pack "$project" -c Release /p:Version=1.0.${{ github.run_number }} -o ./nupkgs
          done

      - name: Push to GitHub Packages
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" \
            --source https://nuget.pkg.github.com/CoreNetMicroservices/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate
