name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: user-ms
            path: backend/user-ms
          - name: communication-ms
            path: backend/communication-ms
          - name: document-ms
            path: backend/document-ms
          - name: translation-ms
            path: backend/translation-ms
          - name: template-ms
            path: backend/template-ms
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ secrets.ACR_LOGIN_SERVER }}

      - name: Build and push image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/corems-${{ matrix.service.name }}:${{ github.sha }} \
            -f ${{ matrix.service.path }}/Dockerfile \
            --build-arg GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            backend/
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/corems-${{ matrix.service.name }}:${{ github.sha }}

  deploy-infrastructure:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5"

      - name: Terraform Init (Services)
        working-directory: infra/services
        run: terraform init

      - name: Terraform Apply (Services)
        working-directory: infra/services
        run: |
          terraform apply -auto-approve \
            -var='image_tags={"user-ms":"${{ github.sha }}","communication-ms":"${{ github.sha }}","document-ms":"${{ github.sha }}","translation-ms":"${{ github.sha }}","template-ms":"${{ github.sha }}"}'

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install and Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist
