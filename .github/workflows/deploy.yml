name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      deploy-all:
        description: 'Build and deploy all services (otherwise only changed)'
        type: boolean
        default: false
      skip-build:
        description: 'Skip Docker build, only run Terraform apply'
        type: boolean
        default: false

permissions:
  packages: read
  contents: read

env:
  AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
  # Single source of truth for the service list. Space-separated for bash loops.
  # JSON and image_tags forms are derived from this at runtime.
  SERVICES: "user-ms communication-ms document-ms translation-ms template-ms"
  RESOURCE_GROUP: "corems-prod-rg"
  CONTAINER_APP_ENV: "corems-prod-rg-cae"
  IMAGE_TAG: "latest"

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    if: inputs.skip-build != true
    outputs:
      services: ${{ steps.filter.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine services to build
        id: filter
        run: |
          # Derive the JSON array of all services from the space-separated env var
          ALL_SERVICES=$(printf '%s\n' $SERVICES | jq -R . | jq -sc .)

          if [ "${{ inputs.deploy-all }}" == "true" ]; then
            echo "Deploy all services"
            echo "services=$ALL_SERVICES" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Compare with last deployed commit (or HEAD~1 as fallback)
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
          CHANGED="[]"

          for svc in $SERVICES; do
            if echo "$CHANGED_FILES" | grep -q "^backend/$svc/\|^backend/common/\|^backend/Directory"; then
              CHANGED=$(echo "$CHANGED" | jq --arg s "$svc" '. + [$s]')
            fi
          done

          # If nothing detected but workflow was triggered, build all
          if [ "$CHANGED" == "[]" ]; then
            echo "No specific changes detected, building all"
            CHANGED="$ALL_SERVICES"
          fi

          echo "Services to build: $CHANGED"
          echo "services=$(echo "$CHANGED" | jq -c .)" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: inputs.skip-build != true
    needs: detect-changes
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ secrets.ACR_LOGIN_SERVER }}

      - name: Build and push image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/corems-${{ matrix.service }}:${{ env.IMAGE_TAG }} \
            -f backend/${{ matrix.service }}/Dockerfile \
            --build-arg GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            backend/
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/corems-${{ matrix.service }}:${{ env.IMAGE_TAG }}

  deploy-infrastructure:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: always() && !failure() && !cancelled()
    needs: build-and-push
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5"
          terraform_wrapper: false

      - name: Terraform Init (Services)
        working-directory: infra/services
        run: |
          terraform init \
            -backend-config="access_key=${{ secrets.TERRAFORM_STATE_ACCESS_KEY }}"

      - name: Import existing resources
        working-directory: infra/services
        continue-on-error: true
        run: |
          SUB_ID="$ARM_SUBSCRIPTION_ID"
          RG="$RESOURCE_GROUP"

          # Import container apps if they exist but aren't in state
          for svc in $SERVICES; do
            echo "Importing $svc..."
            terraform import "azurerm_container_app.services[\"$svc\"]" \
              "/subscriptions/$SUB_ID/resourceGroups/$RG/providers/Microsoft.App/containerApps/$svc" || echo "Import of $svc skipped (already in state or doesn't exist)"
          done

          # Import environment and log analytics if needed
          terraform import azurerm_log_analytics_workspace.main \
            "/subscriptions/$SUB_ID/resourceGroups/$RG/providers/Microsoft.OperationalInsights/workspaces/$RG-logs" || true
          terraform import azurerm_container_app_environment.main \
            "/subscriptions/$SUB_ID/resourceGroups/$RG/providers/Microsoft.App/managedEnvironments/$CONTAINER_APP_ENV" || true

          # Custom domains are now managed entirely by infra/scripts/setup-custom-domain.sh
          # (out-of-band). Remove any previously-managed domain resources from state so
          # Terraform neither destroys the live DNS records nor chokes on the managed cert ID
          # (provider bug #27362). Removing from state leaves the actual Azure resources intact.
          for svc in $SERVICES; do
            terraform state rm "azurerm_container_app_custom_domain.services[\"$svc\"]" 2>/dev/null || true
            terraform state rm "azurerm_dns_cname_record.services[\"$svc\"]" 2>/dev/null || true
            terraform state rm "azurerm_dns_txt_record.services_validation[\"$svc\"]" 2>/dev/null || true
          done
          terraform state rm 'azurerm_dns_a_record.frontend_apex[0]' 2>/dev/null || true
          terraform state rm 'azurerm_dns_cname_record.frontend[0]' 2>/dev/null || true
          terraform state rm 'azurerm_static_web_app_custom_domain.frontend[0]' 2>/dev/null || true
          terraform state rm 'data.azurerm_dns_zone.main' 2>/dev/null || true

      - name: Terraform Apply (Services)
        working-directory: infra/services
        run: |
          # Build image_tags JSON ({"user-ms":"latest",...}) from the service list + tag
          IMAGE_TAGS=$(for svc in $SERVICES; do echo "$svc $IMAGE_TAG"; done \
            | jq -Rn '[inputs | split(" ") | {(.[0]): .[1]}] | add | tojson' -r)

          # Phase 1: ensure the container apps (and their SystemAssigned identity) are applied
          # first. On an existing deployment whose apps predate the identity block, this
          # populates identity[0] in state so the role-assignment plan can read principal_id.
          # -target is safe and is a no-op on a clean apply where everything is created together.
          terraform apply -auto-approve -var="image_tags=$IMAGE_TAGS" \
            $(for svc in $SERVICES; do \
                echo -n "-target=azurerm_container_app.services[\"$svc\"] "; done)

          # Phase 2: full apply — creates role assignments, DNS records, everything else.
          terraform apply -auto-approve -var="image_tags=$IMAGE_TAGS"

  # NOTE: Custom domain binding (frontend apex + API subdomains + managed certificates) is an
  # optional, one-time setup handled by infra/scripts/setup-custom-domain.sh — not part of the
  # regular deploy flow. Most CoreMS deployments run fine on the default Azure hostnames.
  #
  # The frontend is deployed by its own workflow (.github/workflows/deploy-frontend.yml) so it
  # can be released independently and derive its API URLs from the target domain / FQDNs.
