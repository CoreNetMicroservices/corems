name: Publish NuGet Packages

on:
  push:
    branches: [main]
    paths:
      - 'backend/common/src/**'
      - 'backend/aspire/CoreMs.ServiceDefaults/**'
      - 'backend/communication-ms/src/CoreMs.CommunicationMs.Client/**'
      - 'backend/template-ms/src/CoreMs.TemplateMs.Client/**'
      - 'backend/document-ms/src/CoreMs.DocumentMs.Client/**'
  workflow_dispatch:

permissions:
  packages: write
  contents: read

env:
  FEED_URL: https://nuget.pkg.github.com/CoreNetMicroservices/index.json
  VERSION: "1.0.${{ github.run_number }}"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Detect changed packages
        id: changes
        run: |
          # Compare HEAD with HEAD~1 to find changed shared library paths
          # Map changed paths to package project directories
          # Output a space-separated list of project paths that need packing

          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          PROJECTS=""

          if echo "$CHANGED_FILES" | grep -q "^backend/common/src/CoreMs.Common/"; then
            PROJECTS="$PROJECTS backend/common/src/CoreMs.Common/CoreMs.Common.csproj"
          fi
          if echo "$CHANGED_FILES" | grep -q "^backend/common/src/CoreMs.Common.Testing/"; then
            PROJECTS="$PROJECTS backend/common/src/CoreMs.Common.Testing/CoreMs.Common.Testing.csproj"
          fi
          if echo "$CHANGED_FILES" | grep -q "^backend/aspire/CoreMs.ServiceDefaults/"; then
            PROJECTS="$PROJECTS backend/aspire/CoreMs.ServiceDefaults/CoreMs.ServiceDefaults.csproj"
          fi
          if echo "$CHANGED_FILES" | grep -q "^backend/communication-ms/src/CoreMs.CommunicationMs.Client/"; then
            PROJECTS="$PROJECTS backend/communication-ms/src/CoreMs.CommunicationMs.Client/CoreMs.CommunicationMs.Client.csproj"
          fi
          if echo "$CHANGED_FILES" | grep -q "^backend/template-ms/src/CoreMs.TemplateMs.Client/"; then
            PROJECTS="$PROJECTS backend/template-ms/src/CoreMs.TemplateMs.Client/CoreMs.TemplateMs.Client.csproj"
          fi
          if echo "$CHANGED_FILES" | grep -q "^backend/document-ms/src/CoreMs.DocumentMs.Client/"; then
            PROJECTS="$PROJECTS backend/document-ms/src/CoreMs.DocumentMs.Client/CoreMs.DocumentMs.Client.csproj"
          fi

          if [ -z "$PROJECTS" ]; then
            echo "No shared library changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changed projects: $PROJECTS"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "projects=$PROJECTS" >> $GITHUB_OUTPUT
          fi

      - name: Pack changed packages
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          for project in ${{ steps.changes.outputs.projects }}; do
            echo "Packing $project..."
            dotnet pack "$project" -c Release /p:Version=${{ env.VERSION }} -o ./nupkgs
          done

      - name: Push to GitHub Packages
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" \
            --source ${{ env.FEED_URL }} \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate
