# SonarCloud Configuration for CoreMS
# This file is used by the SonarCloud GitHub Action in CI.
# Requires SONAR_TOKEN secret to be configured in GitHub repository settings.

sonar.projectKey=corems
sonar.organization=corems-org

# Source directories
sonar.sources=backend/

# Exclusions — skip build artifacts, dependencies, and infrastructure code
sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/infra/**

# Coverage report paths (OpenCover format from dotnet test)
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml
